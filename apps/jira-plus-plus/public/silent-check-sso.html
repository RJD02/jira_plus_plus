<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Silent SSO</title>
  </head>
  <body>
    <script>
      // Keycloak expects this page to notify the parent window once the auth result is available.
      window.parent && window.parent.postMessage(window.location.href, window.location.origin);
    </script>
  </body>
</html>
