name: Deploy UAT

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - "README.md"
      - "specs/**"
  workflow_dispatch:

jobs:
  quality-check:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 10

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter ./apps/api prisma generate --schema prisma/schema.prisma

      - name: Lint
        run: |
          pnpm -C apps/jira-plus-plus lint || true
          pnpm -r --filter ./apps/api lint || true

      - name: Typecheck
        run: |
          pnpm -C apps/jira-plus-plus typecheck || true
          pnpm -r --filter ./apps/api typecheck || true

      - name: Test api
        run: pnpm -r --filter ./apps/api test -- --runInBand || true

  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment:
      name: uat
      url: http://157.180.68.89
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.UAT_SSH_KEY }}

      - name: Deploy to UAT
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.UAT_SSH_USER }}@${{ secrets.UAT_SSH_HOST }} << 'REMOTE'
            set -euo pipefail
            cd /opt/jira-plus-plus/uat
            echo "[deploy-uat] Fetching latest code..."
            git fetch origin main
            git reset --hard origin/main
            echo "[deploy-uat] Running deploy script..."
            chmod +x infra/deploy.sh
            ./infra/deploy.sh infra/.env.uat uat
          REMOTE

      - name: Health check
        run: |
          sleep 15
          ssh -o StrictHostKeyChecking=no ${{ secrets.UAT_SSH_USER }}@${{ secrets.UAT_SSH_HOST }} 'curl -sf http://localhost:4002/health'
