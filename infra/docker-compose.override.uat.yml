services:
  api:
    ports:
      - "4002:4000"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uat-api.rule=Host(`157.180.68.89`) && (PathPrefix(`/graphql`) || PathPrefix(`/api/`) || PathPrefix(`/health`))"
      - "traefik.http.routers.uat-api.entrypoints=web"
      - "traefik.http.services.uat-api.loadbalancer.server.port=4000"
      - "traefik.http.routers.uat-api.priority=100"

  web:
    ports:
      - "3001:3000"
    build:
      args:
        VITE_GRAPHQL_ENDPOINT: "http://157.180.68.89/graphql"
        VITE_API_BASE_URL: "http://157.180.68.89"
        VITE_KEYCLOAK_BASE_URL: "http://157.180.68.89"
        VITE_KEYCLOAK_REALM: "nucleus"
        VITE_KEYCLOAK_CLIENT_ID: "jira-plus-plus"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.uat-web.rule=Host(`157.180.68.89`)"
      - "traefik.http.routers.uat-web.entrypoints=web"
      - "traefik.http.services.uat-web.loadbalancer.server.port=3000"
      - "traefik.http.routers.uat-web.priority=1"

  temporal-ui:
    ports:
      - "8081:8080"
